version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: usermanager-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - usermanager-network

  backend:
    build: ./backend
    container_name: usermanager-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/usermanager
      - JWT_SECRET=super_secret_jwt_key
      - PORT=5000
      - NODE_ENV=development
    depends_on:
      - mongodb
    networks:
      - usermanager-network

  frontend:
    build: ./frontend
    container_name: usermanager-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - usermanager-network

volumes:
  mongo-data:

networks:
  usermanager-network:
    driver: bridge
